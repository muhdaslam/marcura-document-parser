[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "marcura-document-parser"
version = "0.1.0"
description = "Extract legal clauses from voyage charter party PDFs using Claude"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "PyMuPDF>=1.24.0",
]

[project.scripts]
charter-extract = "charter_parser.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["charter_parser*"]
